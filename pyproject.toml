[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitae"
version = "0.8.0"
description = "Orbitales atómicos hidrogenoides reales, muestreo y validación numérica (educativo y científico)"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Pedro Sordo Martínez" }]
dependencies = ["numpy>=1.26", "scipy>=1.15"]

[project.optional-dependencies]
dev = ["pytest>=8"]
hf = ["pyscf>=2.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
